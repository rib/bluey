[package]
name = "bluey-web-test"
version = "0.1.0"
edition = "2021"

[dependencies]
bluey = { path = "../bluey" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
uuid = { version = "1.6", features = ["v4"] }
futures = "0.3"
tokio = { version = "1", features = ["sync", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
log = "0.4"
console_log = "1.0"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlButtonElement",
  "Window",
  "Event",
  "EventTarget",
]

[lib]
crate-type = ["cdylib"]

[workspace]
