[package]
name = "bluey-ui"
version = "0.1.0"
edition = "2021"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "env-filter",
    "tracing-log",
] }

winit = "0.30"
wgpu = "27"
pollster = "0.2"
bluey = { path = "../bluey" }
tokio-stream = { version = "0.1", features = ["sync"] }
anyhow = "1"
uuid = { workspace = true }
futures = "0.3"
serde = "1"
serde_json = "1"
lazy_static = "1"
egui = "0.33"
egui-wgpu = { version = "0.33", features = ["winit"] }
egui-winit = { version = "0.33", default-features = false, features = [
    "wayland",
    "android-game-activity",
] }
egui_demo_lib = "0.33"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "macros",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
android-activity = { version = "0.6.1", features = ["game-activity"] }
jni = "0.22.4"
ndk-context = "0.1.1"

[patch.crates-io]
#winit = { git = "https://github.com/rib/winit", branch = "android-activity" }
#winit = { path="../../../winit" }

# Egui 0.19 is missing some fixes for Android so we need to build against
# git master for now
#egui = { git = "https://github.com/emilk/egui" }
#eframe = { git = "https://github.com/emilk/egui" }
#egui_demo_lib = { git = "https://github.com/emilk/egui" }
#egui = { path = "../../../egui/crates/egui" }
#eframe = { path = "../../../egui/crates/eframe" }

[features]
default = []
desktop = []

[lib]
name = "main"
crate-type = ["cdylib"]

[[bin]]
path = "src/lib.rs"
name = "bluey-ui"
required-features = ["desktop"]
