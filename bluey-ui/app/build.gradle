plugins {
    id 'com.android.application'
}

android {
    namespace = "co.bluey.blueyui"

    compileSdk = 36

    defaultConfig {
        applicationId = "co.bluey.blueyui"
        minSdk = 31
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled = false
            //packagingOptions {
            //    doNotStrip '**/*.so'
            //}
            //debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // To use the Games Activity library
    implementation "androidx.games:games-activity:4.4.0"

    implementation(name:'bluey-debug', ext:'aar')
    //implementation 'co.bluey:android-bluey'
}

