plugins {
    id 'com.android.library' version '9.1.0'
    id 'signing'
    id "com.vanniktech.maven.publish" version "0.36.0"
}

def localMaven = project.hasProperty('cargo.targetDir') ? file(project.properties['cargo.targetDir']) : null

group = 'io.github.bluey-project'

// Version configuration
def baseVersion = '0.1.0'
def versionSuffix = project.hasProperty('versionSuffix') ? project.property('versionSuffix') : '-SNAPSHOT'
def allowFullRelease = project.hasProperty('allowFullRelease') ? project.property('allowFullRelease').toBoolean() : false

// Safety check: require explicit flag for full releases (no suffix)
if (versionSuffix.isEmpty() && !allowFullRelease) {
    throw new RuntimeException(
        "\n" +
        "Publishing a full release requires -PallowFullRelease=true.\n" +
        "This prevents accidental releases.\n\n" +
        "Usage: ./gradlew publishToMavenCentral -PversionSuffix= -PallowFullRelease=true\n"
    )
}

version = baseVersion + versionSuffix

// Project metadata
def projectName = 'Bluey'
def projectDescription = 'A cross-platform Bluetooth Low Energy library for Rust'
def projectUrl = 'https://github.com/rib/bluey'
def scmUrl = 'https://github.com/rib/bluey'

description = projectDescription

android {
    namespace = "io.github.bluey_project.bluey"
    compileSdk = 36

    defaultConfig {
        minSdk = 31
        targetSdk = 36
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

mavenPublishing {
    coordinates(group, 'bluey', version)

    pom {
        name = projectName
        description = projectDescription
        url = projectUrl

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
            license {
                name = 'The MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'rib'
                name = 'Robert Bragg'
                url = 'https://github.com/rib'
            }
        }

        scm {
            url = scmUrl
            connection = "scm:git:git://github.com/rib/bluey.git"
            developerConnection = "scm:git:ssh://git@github.com/rib/bluey.git"
        }
    }

    publishToMavenCentral()

    signAllPublications()
}

signing {
    if (findProperty("signing.gnupg.executable")) {
        // Local: Use GPG agent (prompts for passphrase)
        useGpgCmd()
    }
}

// Optional: Keep local maven publishing support
if (localMaven) {
    publishing {
        repositories {
            maven {
                url = localMaven.toURI()
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.18.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    compileOnly 'io.github.jni-rs:jbindgen-annotations:0.1.0-RC1'
}
