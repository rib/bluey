[package]
name = "bluey"
readme = "README.md"
version = "0.1.0"
keywords = ["bluetooth", "ble", "gatt"]
categories = ["hardware-support"]
license = "MIT"
repository = "https://github.com/rib/bluey"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "bluey"

[dependencies]
async-trait = "0.1"
futures = "0.3"
log = "0.4"
thiserror = "1.0"
anyhow = "1.0"
uuid = { workspace = true }
dashmap = "4"
serde = { version = "1.0", features = ["derive"] }
arrayvec = "0.7"
function_name = "0.2.0"
lazy_static = "1"
bitflags = "1"
const_format = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "macros",
] }
tokio-stream = { version = "0.1", features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = "0.19.0"

[target.'cfg(target_os = "windows")'.build-dependencies]
windows = "0.19.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.0"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
anyhow = "1.0"
uuid = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2 = "0.6.1"
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"] }
objc2 = { version = "0.6.1", features = ["relax-sign-encoding"] }
objc2-foundation = { version = "0.3.1", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSEnumerator",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSNotification",
    "NSObjCRuntime",
    "NSOperation",
    "NSPathUtilities",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSValue",
] }
objc2-core-bluetooth = { version = "0.3.1", features = [ "dispatch2" ] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tokio = { version = "1", features = ["sync", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Event",
  "EventTarget",
  "Window",
  "Navigator",
  "Bluetooth",
  "BluetoothLeScanFilterInit",
  "RequestDeviceOptions",
  "BluetoothDevice",
  "BluetoothRemoteGattServer",
  "BluetoothRemoteGattCharacteristic",
  "BluetoothRemoteGattService",
  "BluetoothRemoteGattDescriptor",
  "BluetoothCharacteristicProperties",
]

[dev-dependencies]
# upstream pretty_env_logger is no longer maintained...
#pretty_env_logger = { git = "https://github.com/project-anni/pretty-env-logger.git" }
pretty_env_logger = "0.5"
env_logger = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "signal",
] }

[build-dependencies]
execute = "0.2"
